<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111111}
body{display:flex;align-items:center;justify-content:center}
.logo{width:192px;height:192px;object-fit:contain;animation:androidSplashIn .32s cubic-bezier(.2,.8,.2,1) both}

</style>
</head>
<body><img class="logo" src="../assets/libby-android-icon.webp" aria-label="Libby"></body>
</html>
