<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;background:#111;color:#fff}
body{display:flex;align-items:center;justify-content:center}
.wrap{text-align:center;animation:fadeIn .55s ease-out both}.logo{width:132px;height:132px;object-fit:contain;animation:pop .7s cubic-bezier(.2,.8,.2,1) both}.name{font-size:30px;font-weight:600;letter-spacing:.2px;margin-top:18px}.sub{opacity:.68;font-size:13px;margin-top:8px}.spinner{width:26px;height:26px;margin:25px auto 0;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:scale(1)}}
</style></head><body><div class="wrap"><img class="logo" src="../assets/libby-android-icon.webp"><div class="name">Libby</div><div class="sub">Starting Libby</div><div class="spinner"></div></div></body></html>
