<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;font-family:"Segoe UI",system-ui,sans-serif;background:#111;color:#fff}body{display:flex;align-items:center;justify-content:center}.card{width:min(560px,82vw);text-align:center}.logo{width:90px}.title{font-size:28px;margin:20px 0 10px}.text{opacity:.72;line-height:1.55}.buttons{display:flex;gap:12px;justify-content:center;margin-top:25px}button{font:inherit;padding:11px 20px;border:0;border-radius:9px;cursor:pointer}button.primary{background:#fff;color:#111}button.secondary{background:#2a2a2a;color:#fff}.details{margin-top:22px;text-align:left;background:#191919;border-radius:10px;padding:14px;font:12px Consolas,monospace;white-space:pre-wrap;max-height:150px;overflow:auto;opacity:.8}
</style></head><body><div class="card"><img class="logo" src="../assets/libby-android-icon.webp"><div class="title">Libby is taking too long to start</div><div class="text">The Windows native bridge did not complete the Libby startup handshake. You can retry without losing your saved Libby data, or open diagnostics.</div><div class="buttons"><button class="primary" id="retry">Retry</button><button class="secondary" id="diag">Diagnostics</button></div><div class="details" id="details"></div></div><script>
const q=new URLSearchParams(location.search); document.getElementById('details').textContent=q.get('error')||'No additional error reported.';
document.getElementById('retry').onclick=()=>window.LIBBY_WINDOWS.retry(); document.getElementById('diag').onclick=()=>window.LIBBY_WINDOWS.diagnostics();
</script></body></html>
